<!DOCTYPE html>
<!--
  EG Quincenas — Parte B de sueldos · E.G. Corrugados
  Aplicación hecha por Raquel Cacavelos.

  En memoria de mi papá, Gerardo, analista programador,
  que me enseñó que las producciones propias se firman.
-->
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quincenas · EG Corrugados</title>
<style>
:root{
  --tinta:#1a2b34;        /* azul pizarra oscuro */
  --tinta-2:#33474f;
  --papel:#f0ebe0;        /* cartón claro */
  --papel-2:#e4dccb;
  --carton:#c8853f;       /* corrugado / kraft */
  --carton-osc:#a86a2b;
  --verde:#3f7d5a;
  --verde-bg:#e3efe7;
  --rojo:#b0483c;
  --rojo-bg:#f4e5e2;
  --ambar:#c98a1e;
  --ambar-bg:#f7edd5;
  --linea:#cdc3af;
  --linea-fuerte:#b3a689;
  --sombra:0 1px 3px rgba(26,43,52,.12), 0 1px 2px rgba(26,43,52,.08);
  --sombra-alta:0 4px 16px rgba(26,43,52,.16);
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--papel);color:var(--tinta);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{max-width:1000px;margin:0 auto;padding:0 16px 60px}
h1,h2,h3{font-weight:600;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:14px}
.oculto{display:none!important}

/* ---------- Encabezado ---------- */
header{position:sticky;top:0;z-index:40;background:var(--tinta);
  margin:0 -16px 0;padding:12px 16px;box-shadow:var(--sombra)}
.hd-fila{display:flex;align-items:center;gap:12px;max-width:1000px;margin:0 auto}
.hd-logo{width:38px;height:38px;border-radius:9px;background:var(--carton);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-weight:700;color:#fff;font-size:18px;letter-spacing:-.03em}
.hd-tit{color:var(--papel);font-size:16px;font-weight:600;line-height:1.15}
.hd-sub{color:#9fb0b8;font-size:12px}
.hd-per{margin-left:auto;display:flex;align-items:center;gap:8px}
.hd-per select{background:var(--tinta-2);color:var(--papel);border:1px solid #46606a;
  border-radius:8px;padding:7px 10px;max-width:210px}

/* ---------- Navegación por pestañas ---------- */
nav{display:flex;gap:2px;margin:0 -16px 18px;padding:0 10px;background:var(--tinta-2);
  overflow-x:auto;scrollbar-width:none}
/* Barra de período activo — bien visible en todas las pestañas */
.periodo-activo{background:var(--verde,#1f5c3d);color:#fff;text-align:center;
  font-weight:700;font-size:15px;letter-spacing:.2px;padding:10px 14px;border-radius:10px;
  margin:0 0 16px;box-shadow:var(--sombra);display:flex;align-items:center;
  justify-content:center;gap:8px}
.periodo-activo .pin{font-size:16px}
.periodo-activo .et{font-weight:500;opacity:.85;font-size:13px}
@media print{.periodo-activo{display:none}}
nav::-webkit-scrollbar{display:none}
.tab{background:none;border:none;color:#a8b9c0;padding:12px 14px;font-size:13.5px;
  font-weight:500;white-space:nowrap;border-bottom:3px solid transparent;transition:.15s}
.tab:hover{color:var(--papel)}
.tab.on{color:#fff;border-bottom-color:var(--carton)}

/* ---------- Tarjetas ---------- */
.card{background:#fff;border:1px solid var(--linea);border-radius:var(--r);
  box-shadow:var(--sombra);margin-bottom:16px;overflow:hidden}
.card-cab{padding:14px 18px;border-bottom:1px solid var(--linea);
  display:flex;align-items:center;gap:12px;background:var(--papel-2)}
.card-cab h2{font-size:16px}
.card-cab .sub{font-size:12.5px;color:var(--tinta-2);opacity:.8}
.card-cuerpo{padding:18px}

/* ---------- Menú inicio ---------- */
.grid-menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}
.menu-item{background:#fff;border:1px solid var(--linea);border-radius:var(--r);
  padding:16px;text-align:left;transition:.15s;box-shadow:var(--sombra)}
.menu-item:hover{border-color:var(--carton);box-shadow:var(--sombra-alta);transform:translateY(-1px)}
.menu-item .ico{width:38px;height:38px;border-radius:9px;background:var(--papel-2);
  display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:10px}
.menu-item .t{font-weight:600;font-size:14.5px;display:block}
.menu-item .d{font-size:12px;color:var(--tinta-2);opacity:.75}

/* ---------- Formularios ---------- */
.campo{display:flex;flex-direction:column;gap:3px}
.campo label{font-size:12px;color:var(--tinta-2);font-weight:500}
.campo input,.campo select{border:1px solid var(--linea-fuerte);border-radius:7px;
  padding:8px 10px;background:#fff;color:var(--tinta);width:100%}
.campo input:focus,.campo select:focus{outline:2px solid var(--carton);outline-offset:-1px;border-color:var(--carton)}
.campo input[readonly]{background:var(--papel-2);color:var(--tinta-2)}
.grid-campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}

/* ---------- Chips empleados ---------- */
.tab.vieja{opacity:.45;font-size:12.5px}
.tab.vieja:hover{opacity:.8}
.tab.vieja.on{opacity:1}
.tab-sep{align-self:center;color:#a8b9c0;opacity:.5;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;padding:0 8px 0 14px;white-space:nowrap}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:4px}
.chip{border:1px solid var(--linea-fuerte);background:#fff;border-radius:20px;
  padding:7px 15px;font-size:13.5px;font-weight:500;color:var(--tinta-2);transition:.12s}
.chip:hover{border-color:var(--carton)}
.chip.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.chip .pt{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;background:var(--verde)}
.chip.pend .pt{background:var(--linea-fuerte)}

/* ---------- Liquidación ---------- */
.liq{background:var(--papel);border-radius:var(--r);padding:14px 16px;margin-top:4px}
.liq-fila{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;font-size:14px}
.liq-fila .cc{color:var(--tinta-2)}
.liq-fila .nota{font-size:11.5px;color:#8a7d63;margin-left:6px}
.liq-fila .vv{font-variant-numeric:tabular-nums;font-weight:500}
.liq-sep{border-top:1px solid var(--linea-fuerte);margin:4px 0}
.liq-fila.desc .cc,.liq-fila.desc .vv{color:var(--rojo)}
.liq-fila.tot{border-top:2px solid var(--tinta);margin-top:5px;padding-top:9px}
.liq-fila.tot .cc{font-weight:700;font-size:15px;color:var(--tinta)}
.liq-fila.tot .vv{font-weight:700;font-size:19px;color:var(--tinta)}
.badge-ok{font-size:11.5px;background:var(--verde-bg);color:var(--verde);padding:2px 8px;border-radius:12px;font-weight:600}
.badge-no{font-size:11.5px;background:var(--rojo-bg);color:var(--rojo);padding:2px 8px;border-radius:12px;font-weight:600}

/* ---------- Botones ---------- */
.btn{background:var(--carton);color:#fff;border:none;border-radius:8px;
  padding:9px 16px;font-size:14px;font-weight:600;transition:.15s}
.btn:hover{background:var(--carton-osc)}
.btn.sec{background:#fff;color:var(--tinta);border:1px solid var(--linea-fuerte)}
.btn.sec:hover{background:var(--papel-2)}
.btn.chico{padding:6px 12px;font-size:13px}
.btn-fila{display:flex;gap:10px;margin-top:16px}

/* ---------- Tablas ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{background:var(--papel-2);text-align:right;padding:10px 10px;font-weight:600;
  color:var(--tinta-2);border-bottom:1px solid var(--linea-fuerte)}
thead th:first-child{text-align:left}
tbody td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--linea);
  font-variant-numeric:tabular-nums}
tbody td:first-child{text-align:left;font-weight:500}
tbody tr:last-child td{border-bottom:none}
.t-total td{background:var(--papel-2);font-weight:700;border-top:2px solid var(--linea-fuerte)}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--linea);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sombra)}
.kpi .k{font-size:12.5px;color:var(--tinta-2)}
.kpi .v{font-size:23px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi.rojo .v{color:var(--rojo)}
.kpi.ambar .v{color:var(--ambar)}
.kpi.verde .v{color:var(--verde)}

.aviso{background:var(--ambar-bg);border:1px solid #e6cf94;border-radius:8px;
  padding:10px 14px;font-size:13px;color:#7a5a12;margin-bottom:14px}
.vacio{text-align:center;padding:40px 20px;color:var(--tinta-2)}
.vacio .ico{font-size:38px;opacity:.4;margin-bottom:10px}

@media(max-width:560px){
  .hd-per select{max-width:150px}
  .liq-fila .nota{display:none}
}
/* ---------- Pantalla única de carga (nueva) ---------- */
.carga-cols{display:grid;grid-template-columns:1fr 330px;gap:18px;align-items:start}
@media (max-width:980px){ .carga-cols{grid-template-columns:1fr} }
.carga-bloque{border:1px solid var(--linea);border-radius:10px;padding:13px 15px;margin-bottom:14px;background:#fff}
.carga-bloque > h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--tinta-2);margin-bottom:10px;font-weight:700}
.carga-liq{position:sticky;top:14px}
.carga-item{border:1px solid var(--linea);border-radius:9px;padding:10px 12px;margin-bottom:10px;background:var(--papel-2)}
.carga-item .cab{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;font-weight:600}
.carga-queda{font-size:12.5px;color:var(--tinta-2)}
.carga-neto{display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin-top:10px;padding-top:10px;border-top:1px solid var(--linea);font-size:13.5px}
.carga-neto.falta{color:var(--tinta-2)}
.hint-carga{font-size:11.5px;color:var(--tinta-2);margin-top:6px;line-height:1.5}
.carga-vacrec{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:8px 10px;background:var(--papel-2);border-radius:8px;font-size:13px}
.mini{font-size:10.5px;color:var(--tinta-2);font-weight:400}
@media print{ .carga-liq{position:static} }
/* ---------- Comprobante ---------- */
.comprobante{background:#fff;border:1px solid var(--linea-fuerte);border-radius:var(--r);
  padding:24px 28px;margin-bottom:16px;position:relative;box-shadow:var(--sombra)}
.comp-cab{display:flex;justify-content:space-between;align-items:flex-start;
  border-bottom:2px solid var(--tinta);padding-bottom:12px;margin-bottom:14px;
  /* lugar para el botón "Solo este", que va absoluto en esa esquina y tapaba el apellido */
  padding-right:104px}
@media (max-width:640px){ .comp-cab{padding-right:96px} }
.comp-emp{font-size:16px;font-weight:700;color:var(--tinta)}
.comp-tip{font-size:12px;color:var(--tinta-2);margin-top:2px}
.comp-tabla{width:100%;font-size:13.5px}
.comp-tabla td{padding:5px 0;border:none;text-align:left}
.comp-tabla td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.comp-tabla .comp-desc td{color:var(--rojo)}
.comp-tabla .comp-sub td{border-top:1px solid var(--linea-fuerte);padding-top:8px;font-weight:600}
.comp-tabla .comp-tot td{border-top:2px solid var(--tinta);padding-top:9px;font-weight:700;font-size:15px}
.comp-firmas{display:flex;justify-content:space-between;margin-top:34px;gap:40px}
.comp-firma{flex:1;text-align:center;border-top:1px solid var(--tinta-2);padding-top:6px;
  font-size:11px;color:var(--tinta-2)}
.comp-btn{position:absolute;top:16px;right:20px}

@media print{
  header,nav,.btn-fila,.no-print{display:none!important}
  body{max-width:none;padding:0}
  .card{box-shadow:none;border:1px solid #999}
  input{border:none!important;padding:0!important;background:none!important;width:auto!important;
    color:#1a2b34!important;font-size:13px!important;-webkit-appearance:none;-moz-appearance:textfield;appearance:none}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  #comprobantes{display:block}
  .comprobante{border:1px solid #333;box-shadow:none;margin:0 0 8px;padding:12px 16px;
    break-inside:avoid;page-break-inside:avoid}
  .comp-firmas{margin-top:16px}
  /* al imprimir no está el botón, el encabezado usa todo el ancho */
  .comp-cab{padding-right:0}
  @page{margin:11mm}
  /* Salto de página controlado según "por hoja" */
  .ph1 .comprobante{page-break-after:always}
  .ph2 .comprobante:nth-child(2n){page-break-after:always}
  .ph3 .comprobante:nth-child(3n){page-break-after:always}
  .ph4 .comprobante:nth-child(4n){page-break-after:always}
  .comprobante:last-child{page-break-after:auto!important}
}

/* Firma de autoría, al pie de todas las pantallas */
footer.firma{
  max-width:1100px;
  margin:30px auto 20px;
  padding:14px 18px 0;
  border-top:1px solid var(--papel-2);
  text-align:center;
  font-size:12px;
  line-height:1.7;
  color:var(--tinta-2);
  opacity:.8;
}
footer.firma strong{ color:var(--tinta); font-weight:600; }
@media print{ footer.firma{display:none} }
</style>
</head>
<body>

<header>
  <div class="hd-fila">
    <div class="hd-logo">EG</div>
    <div>
      <div class="hd-tit">Quincenas · Parte B</div>
      <div class="hd-sub">EG Corrugados <span id="syncBadge" style="font-size:11px;margin-left:6px;color:#8a7d63">💾 Local</span><span id="espacioBadge" style="font-size:11px"></span></div>
    </div>
    <div class="hd-per">
      <select id="selPeriodo" onchange="App.cambiarPeriodo(this.value)"></select>
      <button class="btn chico" onclick="App.nuevoPeriodo()">+ Nueva</button>
    </div>
  </div>
</header>

<nav id="nav"></nav>

<div id="periodoActivoBar"></div>

<main id="vista"></main>

<footer class="firma">
  Hecha por <strong>Raquel Cacavelos</strong> · E.G. Corrugados
</footer>

<script>
/* ---------------------------------------------------------------
   EG Quincenas — Raquel Cacavelos.

   Para mi papá, Gerardo, analista programador.
   Él me enseñó que las producciones propias se firman: que el que
   hace una cosa pone el nombre abajo y responde por lo que hizo.
   Esta app la escribí con eso en la cabeza. Va firmada, pa.
   --------------------------------------------------------------- */

// Datos base de arranque, tomados del Excel PLANILLAS_SUELDOS_RA.xlsx
// Estos valores son editables desde la pantalla de Ajustes.
const EMPLEADOS_BASE = [
  { id: 'duarte',   apellido: 'Duarte',   categoria: 3, valorHora: 5478.71, viatico: 20.00,    sueldoBruto: 621285.71, adelantoFutAum: 3500,  especial: false },
  { id: 'longoni',  apellido: 'Longoni',  categoria: 2, valorHora: 6081.37, viatico: 5293.14,  sueldoBruto: 676491.60, adelantoFutAum: 0,     especial: false },
  { id: 'gomez',    apellido: 'Gomez',    categoria: 1, valorHora: 6811.14, viatico: 5293.14,  sueldoBruto: 816519.46, adelantoFutAum: 15000, especial: false },
  { id: 'dittrich', apellido: 'Dittrich', categoria: 1, valorHora: 6811.14, viatico: 2005.60,  sueldoBruto: 809163.43, adelantoFutAum: 15000, especial: false },
  { id: 'escalada', apellido: 'Escalada', categoria: 1, valorHora: 6811.14, viatico: 5293.14,  sueldoBruto: 868011.68, adelantoFutAum: 0,     especial: true,
    plusTecho: 280000, hsExtrasFijas: 2 }
];
const COMIDA_POR_DIA = 2500;
const FACTOR_HORA_EXTRA = 1.5;
const FACTOR_PRESENTISMO = 0.17;

// ============ MOTOR DE CÁLCULO — Quincenas Parte B ============
// Reglas confirmadas con EG y verificadas contra el Excel.
function calcularEmpleado(emp, q) {
  // emp: datos base del empleado (valorHora, viatico, sueldoBruto, etc.)
  // q: datos de la quincena para ese empleado
  //    { diasLaborables, diasVino, hsExtras, valorHora, sueldoBruto, viatico,
  //      descuentoVale, descuentoPrestamo }
  const valorHora   = num(q.valorHora ?? emp.valorHora);
  const sueldoBruto = num(q.sueldoBruto ?? emp.sueldoBruto);
  const viatico     = num(q.viatico ?? emp.viatico);
  const diasLab     = num(q.diasLaborables);
  const diasVino    = num(q.diasVino);
  // Días de comida: por defecto igual a los días que vino, pero editable
  // (a veces vino X días pero se le pagó la comida por menos días).
  const diasComida  = (q.diasComida !== undefined && q.diasComida !== null && q.diasComida !== '')
                        ? num(q.diasComida) : diasVino;
  const hsExtras    = num(q.hsExtras);
  // Vacaciones: si está de vacaciones, los días que no vino son vacaciones (no faltas),
  // por lo que cobra el presentismo completo igual.
  const deVacaciones = !!q.vacaciones;
  const diasVacaciones = num(q.diasVacaciones);
  const hsExtrasVac = num(q.hsExtrasVacaciones);
  const vinoCompleto = deVacaciones ? true : (diasLab > 0 && diasVino >= diasLab);

  const r = { apellido: emp.apellido, especial: !!emp.especial };
  // Valores base del desarrollo: no intervienen en ningún cálculo, se exponen
  // para poder controlar en el comprobante cómo se llegó a cada resultado.
  r.baseSueldoBruto = sueldoBruto;
  r.baseValorHora   = valorHora;
  r.baseHsExtras    = hsExtras;
  r.baseDiasVino    = diasVino;
  r.baseDiasLab     = diasLab;
  r.baseViatico     = viatico;

  if (!emp.especial) {
    // ---- Empleado normal ----
    r.hsExtrasMonto = valorHora * FACTOR_HORA_EXTRA * hsExtras;
    r.viaticos      = viatico * diasVino;
    r.comida        = COMIDA_POR_DIA * diasComida;
    r.adelanto      = num(emp.adelantoFutAum);
    // Presentismo = (sueldo bruto + hs extras) * 0,17, solo si vino completo
    r.presentismo   = vinoCompleto ? (sueldoBruto + r.hsExtrasMonto) * FACTOR_PRESENTISMO : 0;
    r.subtotal      = r.hsExtrasMonto + r.viaticos + r.presentismo + r.comida + r.adelanto;
    r.plusMonto = 0; r.plusPresentismo = 0;
  } else {
    // ---- Escalada (caso especial) ----
    const fijas = num(emp.hsExtrasFijas);           // 2 hs fijas siempre
    r.baseHsExtrasFijas = fijas;
    r.hsExtrasFijasMonto = fijas * (valorHora * FACTOR_HORA_EXTRA);
    const hsNormales = Math.max(0, hsExtras - fijas); // las que exceden de 2
    r.hsExtrasMonto = (valorHora * FACTOR_HORA_EXTRA) * hsNormales;
    r.viaticos = viatico * diasVino;
    r.comida   = COMIDA_POR_DIA * diasComida;
    r.adelanto = num(emp.adelantoFutAum);
    // Presentismo común: (hs extras normales + sueldo bruto) * 0,17, solo si vino completo
    r.presentismo = vinoCompleto ? (r.hsExtrasMonto + sueldoBruto) * FACTOR_PRESENTISMO : 0;
    // Plus (techo 280.000): presentismo del plus = techo*0,17; resto = techo - eso
    const techo = num(emp.plusTecho);
    r.plusPresentismo = vinoCompleto ? techo * FACTOR_PRESENTISMO : 0; // 47.600 si vino
    r.plusResto = techo - (techo * FACTOR_PRESENTISMO);                // 232.400 siempre
    r.plusMonto = r.plusResto + r.plusPresentismo;                     // 280.000 o 232.400
    r.subtotal = r.hsExtrasFijasMonto + r.hsExtrasMonto + r.viaticos +
                 r.presentismo + r.comida + r.adelanto + r.plusMonto;
  }

  r.descuentoVale     = num(q.descuentoVale);
  r.descuentoPrestamo = num(q.descuentoPrestamo);

  // Bloque de vacaciones (aparte, se suma al final)
  r.deVacaciones = deVacaciones;
  r.vacPeriodo = q.vacPeriodo || '';
  r.diasVacaciones = diasVacaciones;
  r.hsExtrasVacaciones = hsExtrasVac;
  r.valorHsExtraVac = valorHora * FACTOR_HORA_EXTRA;      // igual que una hs extra
  r.totalVacaciones = deVacaciones ? r.valorHsExtraVac * hsExtrasVac : 0;

  // Total = subtotal Parte B − descuentos + vacaciones
  r.total = r.subtotal - r.descuentoVale - r.descuentoPrestamo + r.totalVacaciones;
  r.vinoCompleto = vinoCompleto;

  // Para SAC: hs extras (normales + fijas de Escalada) + presentismo común + hs extras de vacaciones.
  // NO incluye el presentismo del plus de Escalada.
  const hsExtrasTotal = (r.hsExtrasMonto || 0) + (r.hsExtrasFijasMonto || 0);
  const presentismoTotal = (r.presentismo || 0);
  r.baseSac = hsExtrasTotal + presentismoTotal + (r.totalVacaciones || 0);
  return r;
}

// ============================================================

const App = (function(){
  const LS = 'eg_quincenas_v1';
  // URL del Apps Script (/exec). Si queda vacía, la app funciona solo local (localStorage).
  // Claude Code la completa al publicar el Apps Script.
  const URL_SHEET = 'https://script.google.com/macros/s/AKfycbyjVNhyxuQ4sNcFBW4vEBy4sIQuAkc8RaHUS4j1kA9SDv3Zolr4LDJwiJVI3HA9M-dyvQ/exec';
  const ADMIN_BASE = [
    { nombre: 'Bianchini Emilio', gerente: false },
    { nombre: 'Fotini Alejandro', gerente: false },
    { nombre: 'Cacavelos Raquel', gerente: false },
    { nombre: 'Eduardo Gutman',   gerente: true  }
  ];
  let db = cargar();
  let periodoActivo = null;
  let empActivo = null;
  let tabActiva = 'inicio';
  let mesAdminRecibos = null;
  let sacAnio = null, sacCuota = null, sacEmpSel = null;
  let syncEstado = 'local'; // 'local' | 'sincronizando' | 'ok' | 'error'
  // Solo se escribe en la planilla si ANTES se pudo leer. Sin esto, una lectura
  // fallida arrancaba con la memoria vacia y pisaba los datos de la nube.
  let nubeLeida = false;

  // ---------- Persistencia ----------
  function cargar(){
    try{
      const raw = localStorage.getItem(LS);
      if(raw){
        const d=JSON.parse(raw);
        if(!d.sacBlanco) d.sacBlanco={};
        if(!d.admin || d.admin.length===0) d.admin=JSON.parse(JSON.stringify(ADMIN_BASE));
        return d;

    // estructura inicial
    return {
      empleados: JSON.parse(JSON.stringify(EMPLEADOS_BASE)),

      periodos: {},   // clave "2026-07-2" -> { etiqueta, diasLaborables, datos:{empId:{...}} }
      prestamos: {},  // empId -> [ {tipo, desc, saldo, cuota, ...} ]
      admin: JSON.parse(JSON.stringify(ADMIN_BASE)), // administrativos mensuales (bruto/neto por mes en sacBlanco)
      sacBlanco: {}   // clave "2026-01" -> { empId: { bruto, neto, ajuste, vac:{desde,hasta,monto} } }
    };
  }
  function guardar(){
    try{ localStorage.setItem(LS, JSON.stringify(db)); }
    catch(e){ alert('No se pudo guardar: '+e.message); }
    // Además, sincronizar con la nube (Google Sheets) si está configurada.
    guardarEnNube();
  }

  // ---------- Sincronización con Google Sheets ----------
  function nubeActiva(){ return URL_SHEET && URL_SHEET.indexOf('http')===0; }

  function marcarSync(estado){
    syncEstado = estado;
    const b = document.getElementById('syncBadge');
    if(!b) return;
    const map = {
      local:        {t:'💾 Local',        c:'#8a7d63'},
      sincronizando:{t:'☁ Sincronizando…', c:'#c08a2d'},
      ok:           {t:'☁ Sincronizado',  c:'#3a7d44'},
      error:        {t:"⚠ Sin conexión — no se guarda", c:"#b3402f"}
    };
    const m = map[estado]||map.local;
    b.textContent = m.t; b.style.color = m.c;
    // Aviso de espacio discreto, en un span aparte al lado del badge.
    const se = document.getElementById('espacioBadge');
    if(se) se.innerHTML = avisoEspacioChico();
  }

  // Guarda el db completo en el Sheet (no bloquea la interfaz).
  let guardarTimer=null;
  function guardarEnNube(){
    if(!nubeActiva()) return;
    // Salvaguarda: si la lectura inicial fallo, no sabemos que hay en la planilla.
    // Escribir aca seria pisar datos buenos con una memoria vacia.
    if(!nubeLeida){ marcarSync("error"); return; }
    // "debounce": si se guarda varias veces seguidas, manda una sola vez al final.
    if(guardarTimer) clearTimeout(guardarTimer);
    guardarTimer=setTimeout(()=>{
      marcarSync('sincronizando');
      fetch(URL_SHEET, {
        method:'POST',
        // text/plain evita el preflight CORS de Apps Script
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ action:'save', db: JSON.stringify(db) })
      })
      .then(r=>r.json())
      .then(j=>{ marcarSync(j&&j.ok?'ok':'error'); })
      .catch(()=>{ marcarSync('error'); });
    }, 800);
  }

  // Trae el db del Sheet al abrir. Si hay datos en la nube, reemplazan lo local.
  function cargarDeNube(cb){
    if(!nubeActiva()){ marcarSync('local'); if(cb)cb(); return; }
    marcarSync('sincronizando');
    fetch(URL_SHEET, { method:'GET' })
      .then(r=>r.json())
      .then(j=>{
        // Si la respuesta no es un ok limpio, es una lectura fallida: no marcamos
        // nubeLeida, asi guardarEnNube() se niega a escribir y no pisa nada.
        if(!(j && j.ok)){ marcarSync('error'); if(cb)cb(); return; }
        if(j.db && String(j.db).trim().length){
          try{
            const dNube = JSON.parse(j.db);
            if(!dNube || typeof dNube!=='object') throw new Error('formato invalido');
            if(!dNube.sacBlanco) dNube.sacBlanco={};
            if(!dNube.admin || dNube.admin.length===0) dNube.admin=JSON.parse(JSON.stringify(ADMIN_BASE));
            db = dNube;
            localStorage.setItem(LS, JSON.stringify(db));
          }catch(e){
            // El texto de A1 esta corrupto o incompleto. Mejor no tocar nada.
            marcarSync('error'); if(cb)cb(); return;
          }
        }
        // Lectura confirmada (con datos, o planilla realmente vacia): ya se puede escribir.
        nubeLeida = true;
        marcarSync('ok');
        if(cb)cb();
      })
      .catch(()=>{ marcarSync('error'); if(cb)cb(); });
  }

  // ---------- Utilidades ----------
  function money(n){
    return '$'+ (Number(n)||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  function money0(n){
    return '$'+ Math.round(Number(n)||0).toLocaleString('es-AR');
  }
  // Delante de un sustantivo masculino ("mil", "millones", "centavos") se apocopa:
  // 191.896 es "ciento noventa y UN mil", no "ciento noventa y uno mil".
  function apocope(s){
    if(s==='uno') return 'un';
    if(s.endsWith('veintiuno')) return s.slice(0,-9)+'veintiún';
    if(s.endsWith('uno')) return s.slice(0,-3)+'un';
    return s;
  }
  // Convierte un número entero a palabras en español (para el vale)
  function numeroALetras(n){
    n=Math.round(Number(n)||0);
    if(n===0) return 'cero';
    const unidades=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez',
      'once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte',
      'veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
    const decenas=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
    const centenas=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
    function menores1000(x){
      let t='';
      if(x===100) return 'cien';
      const c=Math.floor(x/100), resto=x%100;
      if(c>0) t+=centenas[c]+(resto>0?' ':'');
      if(resto<30){ t+=unidades[resto]; }
      else { const d=Math.floor(resto/10), u=resto%10;
        t+=decenas[d]+(u>0?' y '+unidades[u]:''); }
      return t.trim();
    }
    let palabras='';
    const millones=Math.floor(n/1000000);
    const miles=Math.floor((n%1000000)/1000);
    const resto=n%1000;
    if(millones>0){ palabras+= (millones===1?'un millón':apocope(menores1000(millones))+' millones')+' '; }
    if(miles>0){ palabras+= (miles===1?'mil':apocope(menores1000(miles))+' mil')+' '; }
    if(resto>0){ palabras+= menores1000(resto); }
    return palabras.trim();
  }
  // Monto completo en palabras, con centavos si los hubiera, listo para el "En letras".
  function montoEnLetras(n){
    const v=Math.abs(Number(n)||0);
    let ent=Math.floor(v);
    let cent=Math.round((v-ent)*100);
    if(cent===100){ ent+=1; cent=0; }
    let t=numeroALetras(ent);
    if(cent>0) t+=' con '+apocope(numeroALetras(cent))+(cent===1?' centavo':' centavos');
    return t.charAt(0).toUpperCase()+t.slice(1);
  }
  function emp(id){ return db.empleados.find(e=>e.id===id); }
  function periodoActual(){ return db.periodos[periodoActivo]; }

  function claveNueva(anio,mes,q){ return `${anio}-${String(mes).padStart(2,'0')}-${q}`; }
  function etiquetaPeriodo(anio,mes,q){
    const meses=['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    return `${q}ª quincena · ${meses[mes]} ${anio}`;
  }

  // ---------- Arranque ----------
  function init(){
    // Primero intentamos traer los datos de la nube (Google Sheets).
    // Si no hay nube configurada, sigue de largo con lo local.
    cargarDeNube(function(){
      arrancar();
    });
  }
  function arrancar(){
    // si no hay ningún período, crear uno por defecto (quincena actual)
    // Si la nube esta configurada pero no se pudo leer, NO inventamos un periodo
    // por defecto: ese fue exactamente el camino que vacio la planilla.
    if(nubeActiva() && !nubeLeida){
      document.getElementById('vista').innerHTML =
        '<div class="card"><div class="card-cuerpo"><div class="aviso">' +
        '<strong>No se pudieron leer los datos de la planilla.</strong><br><br>' +
        'La app quedó en <strong>modo solo lectura</strong>: no va a guardar nada, ' +
        'para no pisar los datos que ya están guardados.<br><br>' +
        'Revisá la conexión a internet y volvé a cargar la página (F5).' +
        '</div></div></div>';
      return;
    }
    if(Object.keys(db.periodos).length===0){
      const hoy=new Date();
      const q = hoy.getDate()<=15?1:2;
      const clave=claveNueva(hoy.getFullYear(),hoy.getMonth()+1,q);
      db.periodos[clave]={etiqueta:etiquetaPeriodo(hoy.getFullYear(),hoy.getMonth()+1,q),
        diasLaborables:12, datos:{}};
      periodoActivo=clave; guardar();
    }
    periodoActivo = periodoActivo || Object.keys(db.periodos).sort().reverse()[0];
    renderPeriodos(); renderNav(); irA('carga');   // la pantalla única es la principal
  }

  // ---------- Aviso de límite de espacio (celda de Google Sheets: 50.000 caracteres) ----------
  const LIMITE_CELDA = 50000;   // máximo de caracteres que aguanta la celda A1
  const CHARS_POR_QUINCENA = 1700; // estimación de cuánto suma cada quincena nueva
  function estadoEspacio(){
    const usado = JSON.stringify(db).length;
    const libre = Math.max(0, LIMITE_CELDA - usado);
    const quincenasRestantes = Math.floor(libre / CHARS_POR_QUINCENA);
    const pct = usado / LIMITE_CELDA;
    let nivel = 'ok';
    if(pct >= 0.92) nivel = 'rojo';
    else if(pct >= 0.80) nivel = 'amarillo';
    return { usado, libre, quincenasRestantes, pct, nivel };
  }
  function avisoEspacioChico(){
    // Texto discreto junto al badge, solo si ya entró en zona amarilla o roja.
    const e = estadoEspacio();
    if(e.nivel === 'ok') return '';
    const color = e.nivel === 'rojo' ? '#b3402f' : '#c08a2d';
    return ` · <span style="color:${color}">📦 espacio: ~${e.quincenasRestantes} quincenas</span>`;
  }
  function avisoEspacioGrande(){
    // Cartel grande arriba de la vista, solo en zona roja (urgente).
    const e = estadoEspacio();
    if(e.nivel !== 'rojo') return '';
    return `<div class="aviso no-print" style="border-color:#b3402f;background:#fff2ef;margin-bottom:12px">
      <strong>📦 La planilla se está quedando sin espacio.</strong> Quedan aproximadamente
      <strong>${e.quincenasRestantes} quincenas</strong> de lugar. Antes de que se llene, hay que
      ampliar la app para que guarde los datos en varias partes (es un cambio técnico).
      Avisá para que lo hagan con tiempo — mientras tanto la app sigue funcionando normal.
    </div>`;
  }

  function renderPeriodos(){
    const sel=document.getElementById('selPeriodo');
    const claves=Object.keys(db.periodos).sort().reverse();
    sel.innerHTML=claves.map(k=>`<option value="${k}" ${k===periodoActivo?'selected':''}>${db.periodos[k].etiqueta}</option>`).join('');
    // Barra grande de período activo (visible en todas las pestañas)
    const bar=document.getElementById('periodoActivoBar');
    if(bar){
      const p = db.periodos[periodoActivo];
      if(p){
        bar.className='periodo-activo';
        bar.innerHTML=`<span class="pin">📌</span><span class="et">Estás trabajando en</span> ${p.etiqueta}`;
      } else {
        bar.className=''; bar.innerHTML='';
      }
    }
  }

  // El tercer valor marca las pantallas ANTERIORES de carga: siguen accesibles
  // como camino de vuelta, pero van al final y atenuadas. Se retiran cuando
  // Raquel confirme una quincena entera cargada con la pantalla nueva.
  const TABS=[
    ['carga','⚡ Carga'],['inicio','Inicio'],
    ['resumen','Resumen jefe'],['comprobantes','Comprobantes'],['sac','SAC'],['sacblanco','SAC blanco'],['totales','Totales'],['ajustes','Ajustes'],
    ['recibos','Recibos',1],['prestamos','Préstamos y vales',1]
  ];
  function renderNav(){
    document.getElementById('nav').innerHTML = TABS.map(function(fila,i){
      const id=fila[0], t=fila[1], vieja=fila[2];
      const primeraVieja = vieja && !(TABS[i-1]||[])[2];
      const sep = primeraVieja ? '<span class="tab-sep" title="Pantallas anteriores de carga">anteriores</span>' : '';
      return sep + `<button class="tab ${vieja?'vieja':''} ${id===tabActiva?'on':''}" onclick="App.irA('${id}')">${t}</button>`;
    }).join('');
  }

  function irA(tab){
    // Una pestaña que ya no existe (retirada) lleva a la pantalla principal de carga.
    if(!TABS.some(function(x){ return x[0]===tab; })) tab='carga';
    const cambioDeTab = (tab!==tabActiva);
    const scrollPrev = window.scrollY;
    tabActiva=tab; renderNav();
    const v=document.getElementById('vista');
    if(tab==='inicio') v.innerHTML=vistaInicio();
    else if(tab==='carga') vistaCarga();
    else if(tab==='recibos') v.innerHTML=vistaRecibos();
    else if(tab==='resumen') v.innerHTML=vistaResumen();
    else if(tab==='comprobantes') v.innerHTML=vistaComprobantes();
    else if(tab==='sac') v.innerHTML=vistaSac();
    else if(tab==='sacblanco') v.innerHTML=vistaSacBlanco();
    else if(tab==='totales') v.innerHTML=vistaTotales();
    else if(tab==='prestamos') v.innerHTML=vistaPrestamos();
    else if(tab==='ajustes') v.innerHTML=vistaAjustes();
    // Aviso grande de espacio (solo en zona roja): se antepone a cualquier pestaña.
    const ae = avisoEspacioGrande();
    if(ae) v.innerHTML = ae + v.innerHTML;
    // Refrescar el aviso chico de espacio junto al badge.
    const seTab = document.getElementById('espacioBadge');
    if(seTab) seTab.innerHTML = avisoEspacioChico();
    // Al cambiar de pestaña, subimos arriba. Si es un refresco de la misma pestaña, conservamos el scroll.
    if(cambioDeTab) window.scrollTo(0,0);
    else window.scrollTo(0,scrollPrev);
  }

    function vacInfoAdmin(claveEmp){

  function setReciboAdmin(nombre,campo,val){
    const claveMes = mesAdminRecibos || periodoActivo.split('-').slice(0,2).join('-');
    db.sacBlanco[claveMes]=db.sacBlanco[claveMes]||{};

  // recibo de vacaciones: claveEmp = empId (quincenal) o 'admin:Nombre'
  // Convierte una fecha escrita en varios formatos a Date. Acepta:
  // AAAA-MM-DD, DD/MM/AAAA, DD-MM-AAAA, DD/MM/AA, con espacios de sobra.
  function parseFecha(s){
    if(!s) return null;
    s=String(s).trim();
    let m;
    // AAAA-MM-DD  o  AAAA/MM/DD
    m=s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
    if(m){ const d=new Date(+m[1],+m[2]-1,+m[3]); return isNaN(d)?null:d; }
    // DD/MM/AAAA  o  DD-MM-AAAA
    m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(m){ const d=new Date(+m[3],+m[2]-1,+m[1]); return isNaN(d)?null:d; }
    // DD/MM/AA  (dos dígitos de año → 20AA)
    m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2})$/);
    if(m){ const d=new Date(2000+ +m[3],+m[2]-1,+m[1]); return isNaN(d)?null:d; }
    // último intento: que lo interprete el navegador
    const d=new Date(s); return isNaN(d)?null:d;
  }
  // normaliza a AAAA-MM-DD para guardar siempre igual
  function fechaISO(s){
    const d=parseFecha(s);
    if(!d) return '';
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function quitarVac(claveEmp){
    const esAdmin = claveEmp.indexOf('admin:')===0;
    const claveMes = esAdmin ? (mesAdminRecibos || periodoActivo.split('-').slice(0,2).join('-'))
                             : periodoActivo.split('-').slice(0,2).join('-');
    const reg=(db.sacBlanco[claveMes]||{})[claveEmp];
    if(!reg || !reg.vac){ alert('Este empleado no tiene vacaciones cargadas en este período.'); return; }
    const v=reg.vac;
    if(!confirm('¿Quitar las vacaciones cargadas'+ (v.desde?(' ('+v.desde+' al '+v.hasta+')'):'') +'? Esta acción no se puede deshacer.')) return;
    delete db.sacBlanco[claveMes][claveEmp].vac;
    guardar(); refrescarTrasCambio();
  }
  function reciboVac(claveEmp){
    const esAdmin = claveEmp.indexOf('admin:')===0;
    const claveMes = esAdmin ? (mesAdminRecibos || periodoActivo.split('-').slice(0,2).join('-'))
                             : periodoActivo.split('-').slice(0,2).join('-');
    const reg=(db.sacBlanco[claveMes]||{})[claveEmp]||{};
    const vac=reg.vac||{};
    const desdeIn=prompt('Recibo de VACACIONES — fecha DESDE (podés escribir 10/08/2026 o 2026-08-10):', vac.desde||'');
    if(desdeIn===null) return;
    const hastaIn=prompt('Recibo de VACACIONES — fecha HASTA (podés escribir 16/08/2026 o 2026-08-16):', vac.hasta||'');
    if(hastaIn===null) return;
    const bruto=prompt('BRUTO remunerativo del recibo de vacaciones (para el SAC):', vac.monto||'');
    if(bruto===null) return;
    const neto=prompt('NETO del recibo de vacaciones (va al resumen de Eduardo):', vac.neto||'');
    if(neto===null) return;
    const desde=fechaISO(desdeIn), hasta=fechaISO(hastaIn);
    db.sacBlanco[claveMes]=db.sacBlanco[claveMes]||{};
    db.sacBlanco[claveMes][claveEmp]=db.sacBlanco[claveMes][claveEmp]||{};
    const hayMonto = leerMonto(bruto)>0||leerMonto(neto)>0;
    if(desde&&hasta&&hayMonto){
      const tot=diasTotales(desde,hasta);
      if(tot>0){
        db.sacBlanco[claveMes][claveEmp].vac={desde,hasta,monto:leerMonto(bruto)||0,neto:leerMonto(neto)||0};
        alert('Recibo de vacaciones guardado: '+tot+' días corridos ('+desde+' al '+hasta+'). El bruto se prorratea solo en el SAC si cae entre dos meses; el neto va al resumen.');
      } else {
        alert('Las fechas no son válidas: la fecha "hasta" tiene que ser igual o posterior a la "desde". No se guardó.');
      }
    } else if(!desde||!hasta){
      alert('No pude entender las fechas. Escribilas como 10/08/2026 o 2026-08-10. No se guardó.');
    } else {
      delete db.sacBlanco[claveMes][claveEmp].vac;
      alert('Recibo de vacaciones quitado.');
    }
    guardar(); refrescarTrasCambio();
  }
  // neto de vacaciones que cae en un mes puntual (para el resumen de Eduardo)
  function vacNetoMes(claveEmp,anio,mes){
    const claveMes = `${anio}-${String(mes).padStart(2,'0')}`;
    const r=(db.sacBlanco[claveMes]||{})[claveEmp];
    return (r && r.vac && r.vac.neto>0) ? (parseFloat(r.vac.neto)||0) : 0;

  // ---------- Pantalla: Cargar quincena ----------
  // ============================================================
  //  Pantalla única de carga (v1) — REUSA el motor existente.
  //  No calcula nada por su cuenta: arma el mismo formulario con los
  //  MISMOS ids de campo que lee leerFicha(), y llama a calc() /
  //  toggleVac() / calcularEmpleado() tal como están. Valor hora y
  //  viático viajan ocultos (se editan en Ajustes) para no romper
  //  leerFicha(), que los espera.
  // ============================================================
  // Después de una acción que cambia datos (vale, préstamo, recibo de vacaciones, mes de
  // administrativos): en ⚡ Carga se refrescan solo las partes afectadas, para no perder lo
  // que esté tipeado sin guardar; en cualquier otra pestaña se vuelve a pintar esa misma.
  function refrescarTrasCambio(){
    if(tabActiva==='carga' && document.getElementById('cargaUI')){
      renderVacReciboCarga(); renderAdminCarga(); calcCarga();
    } else {
      irA(tabActiva);
    }
  }

      </div>`;

  // Lee un monto escrito a mano como se escribe acá: "120.000", "191.895,77", "$ 1.500",
  // o también "120000" y "191895.77". Devuelve NaN si no es un número claro.
  function leerMonto(s){
    let txt=String(s==null?'':s).replace(/\$/g,'').replace(/\s/g,'');
    if(txt==='') return NaN;
    if(txt.indexOf(',')>=0) txt=txt.replace(/\./g,'').replace(',','.');
    else if(/^\d{1,3}(\.\d{3})+$/.test(txt)) txt=txt.replace(/\./g,'');
    return Number(txt);
  }
  // ---------- Carga: corregir un vale o préstamo desde su tarjeta ----------
  // La tarjeta muestra "debe" = la deuda ANTES de esta quincena, así que se pide ese mismo
  // número y se le resta lo ya descontado esta quincena para guardar el saldo.
  function corregirItemCarga(empId,itemId){
    const x=(db.prestamos[empId]||[]).find(function(i){ return i.id===itemId; }); if(!x) return;
    const clave=periodoActivo+'|'+empId;
    const yaAplicado=(x.aplicaciones&&x.aplicaciones[clave])||0;
    const tipo = x.tipo==='vale' ? 'vale' : 'préstamo';
    const desc=prompt('Descripción del '+tipo+':', x.desc||'');
    if(desc===null) return;
    const antes=Math.round(((Number(x.saldo)||0)+yaAplicado)*100)/100;
    const s=prompt('Deuda ANTES de esta quincena (lo que dice "debe" en la tarjeta):', antes);
    if(s===null) return;
    const nuevo=leerMonto(s);
    if(isNaN(nuevo)||nuevo<0){ alert('Poné un monto válido. No se cambió nada.'); return; }
    if(nuevo<yaAplicado){
      alert('Esta quincena ya se descontaron '+money(yaAplicado)+' de este '+tipo+', así que la deuda de antes no puede ser menor. Primero bajá el descuento y guardá la quincena. No se cambió nada.');
      return;
    }
    x.desc=desc;
    x.saldo=nuevo-yaAplicado;
    if(x.saldo<=0.001){ x.saldo=0; x.saldado=true; } else { x.saldado=false; }
    guardar(); refrescarTrasCambio();
  }

  function cargaCompleto(d){
    return !!(d && d.diasVino!==undefined && d.diasVino!=='');
  }
  // Saldo del item sin contar lo ya aplicado en ESTA quincena, para poder
  // recalcular en vivo aunque la ficha ya se haya guardado antes.
  function saldoBase(x){
    const clave = periodoActivo+'|'+empActivo;
    const yaAplicado = (x.aplicaciones && x.aplicaciones[clave]) || 0;
    return (Number(x.saldo)||0) + yaAplicado;
  }
  // Reparte un monto entre los items de un tipo igual que lo hace aplicarA():
  // en orden, hasta agotar el saldo de cada uno. Así el "queda $X" que se ve
  // en pantalla es exactamente lo que va a pasar al guardar.
  function repartoPreview(items, monto){
    let resto = Number(monto)||0;
    return items.map(function(x){
      const base = saldoBase(x);
      const aplica = Math.max(0, Math.min(resto, base));
      resto -= aplica;
      return { item:x, base:base, aplica:aplica, queda: base-aplica };
    });
  }

                  <input id="f_vacdias" type="number" value="${val('diasVacaciones','')}" oninput="App.calcCarga()"></div>
                <div class="campo"><label>Hs extras de vacaciones</label>
                  <input id="f_vache" type="number" step="0.1" value="${val('hsExtrasVacaciones','')}" oninput="App.calcCarga()"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="carga-bloque">
          <h3>3 · Vales y préstamos</h3>
          <input type="hidden" id="f_dvale" value="${sugVale}">
          <input type="hidden" id="f_dpres" value="${sugPres}">
          <div id="ccItems"></div>
          <div class="btn-fila">
            <button class="btn sec chico" onclick="App.nuevoItem('${empActivo}','vale')">+ Agregar vale</button>
            <button class="btn sec chico" onclick="App.nuevoItem('${empActivo}','prestamo')">+ Agregar préstamo</button>
            <button class="btn sec chico" style="margin-left:auto" onclick="App.imprimirValesEnBlanco()">🖨 Imprimir vales en blanco</button>
          </div>
        </div>
      </div>

      <div class="carga-liq">
        <div class="carga-bloque" style="margin-bottom:10px">
          <h3>Liquidación en vivo</h3>
          <div id="liqBox"></div>
          <div id="netoBanco"></div>
        </div>
        <div class="btn-fila" style="margin-top:0">
          <button class="btn" onclick="App.guardarCarga()">Guardar</button>
          <button class="btn sec" onclick="App.imprimirCarga()">🖨 Imprimir comprobantes</button>
        </div>
        <div class="hint-carga" style="margin-top:8px">Imprime la quincena y, si esta quincena se descontó cuota o vale, también su comprobante — uno por hoja.</div>
      </div>
    </div>`;
    renderItemsCarga();
    renderVacReciboCarga();
    calcCarga();
  }

  // Tarjetas de vales y préstamos, con el "queda" calculado igual que al guardar.
  function renderItemsCarga(){
    const cont=document.getElementById('ccItems'); if(!cont) return;
    const items=(db.prestamos[empActivo]||[]).filter(function(x){ return saldoBase(x)>0; });
    if(items.length===0){
      cont.innerHTML='<div class="hint-carga">Sin vales ni préstamos pendientes.</div>';
      return;
    }
    const vales=items.filter(function(x){ return x.tipo==='vale'; });
    const pres =items.filter(function(x){ return x.tipo==='prestamo'; });
    const elV=document.getElementById('f_dvale'), elP=document.getElementById('f_dpres');
    const dVale=parseFloat(elV?elV.value:0)||0;
    const dPres=parseFloat(elP?elP.value:0)||0;
    const repVale=repartoPreview(vales,dVale);
    const repPres=repartoPreview(pres,dPres);
    const sugVale=repVale.reduce(function(s,r){ return s+r.base; },0);

    function tarjetas(rep, tipo, total, sugerido){
      return rep.map(function(rr,i){
        const x=rr.item;
        const campo = (i===0)
          ? `<input type="text" inputmode="decimal" autocomplete="off" value="${montoCampo(total)}" style="width:118px;text-align:right"
               onfocus="this.select()"
               oninput="App.setDescuentoCarga('${tipo}',this.value)"
               onchange="App.confirmarDescuentoCarga('${tipo}',this)">`
          : `<span class="mini">se descuenta en orden, después del anterior</span>`;
        const sug = (i===0 && sugerido>0)
          ? `<button class="btn sec chico" onclick="App.setDescuentoCarga('${tipo}',${sugerido},true)">usar ${money0(sugerido)}</button>`
          : '';
        return `<div class="carga-item">
          <div class="cab"><span>${x.tipo==='vale'?'🧾':'💳'} ${x.desc||(x.tipo==='vale'?'Vale':'Préstamo')}</span>
            <span>debe ${money(rr.base)} <span class="mini">antes de esta quincena</span></span></div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap">
            <span class="mini">descontar ahora</span> ${campo} ${sug}
            <span class="carga-queda" data-item="${x.id}" style="margin-left:auto">queda <strong>${money(rr.queda)}</strong></span>
          </div>
          <div class="btn-fila" style="margin-top:6px">
            <button class="btn sec chico" onclick="App.corregirItemCarga('${empActivo}','${x.id}')">✏ Corregir</button>
            <button class="btn sec chico" onclick="App.imprimirVale('${empActivo}','${x.id}')">🧾 Imprimir vale</button>
            <button class="btn sec chico" onclick="App.borrarItem('${empActivo}','${x.id}')">Eliminar</button>
          </div>
        </div>`;
      }).join('');
    }
    cont.innerHTML = tarjetas(repVale,'vale',dVale,sugVale) + tarjetas(repPres,'prestamo',dPres,0);
  }
  // Monto para mostrar en el campo "descontar ahora": 100000 → "100.000", 191895.77 → "191.895,77".
  function montoCampo(n){
    const v=Math.round((Number(n)||0)*100)/100;
    return v.toLocaleString('es-AR',{minimumFractionDigits:Number.isInteger(v)?0:2,maximumFractionDigits:2});
  }
  // Mientras se escribe en "descontar ahora" NO se redibujan las tarjetas: redibujar
  // reemplaza el campo que tiene el cursor y lo descoloca. Solo se actualizan la
  // liquidación, el neto y los "queda". Si lo tipeado todavía no es un número (a medio
  // escribir), se deja el último valor válido. El botón "usar $X" sí redibuja todo.
  function setDescuentoCarga(tipo,val,rerender){
    const el = document.getElementById(tipo==='vale' ? 'f_dvale' : 'f_dpres');
    if(!el) return;
    const n = (typeof val==='number') ? val : (String(val).trim()==='' ? 0 : leerMonto(val));
    if(!isNaN(n) && n>=0) el.value = n;
    if(rerender){ calcCarga(); return; }
    calc(); actualizarNetoCarga(); actualizarQuedaCarga();
  }
  // Al salir del campo (o Enter): validar y dejar el número prolijo en el mismo campo.
  function confirmarDescuentoCarga(tipo,input){
    const el = document.getElementById(tipo==='vale' ? 'f_dvale' : 'f_dpres');
    if(!el) return;
    const txt = String(input.value).trim();
    const n = txt==='' ? 0 : leerMonto(txt);
    if(isNaN(n) || n<0){
      alert('"'+txt+'" no es un monto válido. Escribilo como 50000, 50.000 o 50.000,50. Quedó el último monto válido.');
    } else {
      el.value = n;
    }
    input.value = montoCampo(parseFloat(el.value)||0);
    calc(); actualizarNetoCarga(); actualizarQuedaCarga();
  }
  function actualizarQuedaCarga(){
    const items=(db.prestamos[empActivo]||[]).filter(function(x){ return saldoBase(x)>0; });
    const elV=document.getElementById('f_dvale'), elP=document.getElementById('f_dpres');
    const reps = repartoPreview(items.filter(function(x){ return x.tipo==='vale'; }), parseFloat(elV?elV.value:0)||0)
      .concat(repartoPreview(items.filter(function(x){ return x.tipo==='prestamo'; }), parseFloat(elP?elP.value:0)||0));
    reps.forEach(function(rr){
      const s=document.querySelector('#ccItems .carga-queda[data-item="'+rr.item.id+'"] strong');
      if(s) s.textContent=money(rr.queda);
    });
  }

  // Recalcula con el motor de siempre y agrega lo propio de esta pantalla.
  function calcCarga(){
    calc();                       // ← motor intacto: pinta #liqBox
    actualizarNetoCarga();
    renderItemsCarga();
  }
  function actualizarNetoCarga(){
    const nb=document.getElementById('netoBanco'); if(!nb) return;
    const neto=parseFloat(leerFicha().sueldoBlanco)||0;
    nb.innerHTML = neto>0
      ? `<div class="carga-neto"><span>Neto al banco (Eduardo)</span><strong>${money(neto)}</strong></div>`
      : `<div class="carga-neto falta"><span>Neto al banco (Eduardo)</span><span class="mini">falta cargarlo</span></div>`;
  }
  function toggleVacCarga(){ toggleVac(); calcCarga(); }

  function guardarCarga(){
    const p=periodoActual();
    const clave = periodoActivo+'|'+empActivo;
    revertirAplicacion(empActivo, clave);
    const ficha=leerFicha();
    p.datos[empActivo]=ficha;
    aplicarDescuentos(empActivo, clave, parseFloat(ficha.descuentoVale)||0, parseFloat(ficha.descuentoPrestamo)||0);
    guardar();
    renderChipsCarga(); renderCarga();
    toast('Liquidación guardada');
  }

  // Imprime, uno por hoja: comprobante de quincena + el de préstamo y/o vale
  // con el saldo que queda, si esta quincena se descontó algo.
  function imprimirCarga(){
    const e=emp(empActivo), p=periodoActual();
    const q=leerFicha();
    const r=calcularEmpleado(e,q);
    let html = comprobanteHTML(e,r,p);
    const items=(db.prestamos[empActivo]||[]);
    const repPres=repartoPreview(items.filter(function(x){ return x.tipo==='prestamo'; }), parseFloat(q.descuentoPrestamo)||0);
    const repVale=repartoPreview(items.filter(function(x){ return x.tipo==='vale'; }), parseFloat(q.descuentoVale)||0);
    const huboPres=repPres.some(function(x){ return x.aplica>0; });
    const huboVale=repVale.some(function(x){ return x.aplica>0; });
    const quedaPres=repPres.reduce(function(s,x){ return s+x.queda; },0);
    const quedaVale=repVale.reduce(function(s,x){ return s+x.queda; },0);
    if(huboPres && quedaPres>0) html += comprobanteDeudaHTML(e,quedaPres,p);
    if(huboVale && quedaVale>0) html += comprobanteDeudaHTML(e,quedaVale,p,'COMPROBANTE DE VALE');
    const cont=document.getElementById('printCarga');
    const ui=document.getElementById('cargaUI');
    cont.innerHTML=html; cont.classList.remove('oculto');
    ui.classList.add('no-print');
    window.print();
    cont.classList.add('oculto'); cont.innerHTML='';
    ui.classList.remove('no-print');
  }



  function toggleVac(){
    const chk=document.getElementById('f_vac');
    document.getElementById('vacCampos').classList.toggle('oculto', !chk.checked);
    calc();
  }

  function leerFicha(){
    return {
      valorHora:document.getElementById('f_vh').value,
      sueldoBruto:document.getElementById('f_sb').value,
      sueldoBlanco:document.getElementById('f_bl').value,
      viatico:document.getElementById('f_vi').value,
      diasVino:document.getElementById('f_dv').value,
      diasComida:document.getElementById('f_dc')?document.getElementById('f_dc').value:'',
      hsExtras:document.getElementById('f_he').value,
      descuentoVale:document.getElementById('f_dvale').value,
      descuentoPrestamo:document.getElementById('f_dpres').value,
      vacaciones:document.getElementById('f_vac')?document.getElementById('f_vac').checked:false,
      vacPeriodo:document.getElementById('f_vacper')?document.getElementById('f_vacper').value:'',
      diasVacaciones:document.getElementById('f_vacdias')?document.getElementById('f_vacdias').value:0,
      hsExtrasVacaciones:document.getElementById('f_vache')?document.getElementById('f_vache').value:0,
      diasLaborables:periodoActual().diasLaborables
    };
  }

  function calc(){
    const e=emp(empActivo);
    const q=leerFicha();
    const r=calcularEmpleado(e,q);
    // aviso de control: días que vino no puede superar los laborables
    let aviso='';
    if(+q.diasVino > +q.diasLaborables){
      aviso=`<div class="aviso" style="background:var(--rojo-bg);border-color:#e0b0a8;color:var(--rojo)">⚠ Cargaste ${q.diasVino} días trabajados pero la quincena tiene ${q.diasLaborables} laborables. Revisá el dato.</div>`;
    }
    if(r.total < 0){
      const exceso = money0(-r.total);
      aviso+=`<div class="aviso" style="background:var(--rojo-bg);border-color:#e0b0a8;color:var(--rojo)">⚠ El descuento supera lo que cobra esta quincena por ${exceso}. Corregí el monto del vale o de la cuota de préstamo para que no quede en negativo.</div>`;
    }
    document.getElementById('liqBox').innerHTML=aviso+renderLiq(e,r);
  }

  function renderLiq(e,r){
    // En la pantalla única mostramos los valores reales al lado de cada renglón
    // (los mismos que van al pie del comprobante). En las pestañas viejas queda
    // la fórmula genérica de siempre.
    const det = !!document.getElementById('cargaUI');
    const vh  = money(r.baseValorHora);
    let filas='';
    if(e.especial){
      const fij = r.baseHsExtrasFijas||0;
      const exc = Math.max(0,(r.baseHsExtras||0)-fij);
      filas+=liqFila('Horas extras fijas',det?`${fij} hs × ${vh} × 1,5`:'2 × valor hora × 1,5',r.hsExtrasFijasMonto);
      filas+=liqFila('Horas extras',det?`${exc} hs × ${vh} × 1,5`:'excedente sobre las 2 fijas',r.hsExtrasMonto);
    }else{
      filas+=liqFila('Horas extras',det?`${r.baseHsExtras||0} hs × ${vh} × 1,5`:'valor hora × 1,5 × cant.',r.hsExtrasMonto);
    }
    filas+=liqFilaPres(r,det);
    filas+=liqFila('Viáticos',det?`${money(r.baseViatico)}/día × ${r.baseDiasVino||0} días`:'viático/día × días',r.viaticos);
    filas+=liqFila('Comida','$'+db.config.comidaPorDia+' × días',r.comida);
    if(r.adelanto) filas+=liqFila('Adelanto fut. aumentos','',r.adelanto);
    if(e.especial){
      filas+=liqFila('Plus (resto)','techo − presentismo del plus',r.plusResto);
      filas+=liqFilaPresPlus(r);
    }
    let desc='';
    if(r.descuentoVale) desc+=liqFila('− Vale','',-r.descuentoVale,'desc');
    if(r.descuentoPrestamo) desc+=liqFila('− Cuota préstamo','',-r.descuentoPrestamo,'desc');
    let vac='';
    if(r.deVacaciones){
      vac=`<div class="liq-sep"></div>
        <div class="liq-fila"><span class="cc" style="font-weight:600">🌴 Vacaciones${r.diasVacaciones?` (${r.diasVacaciones} días)`:''}</span><span class="vv"></span></div>
        <div class="liq-fila"><span class="cc">Valor hs extra vac.<span class="nota">valor hora × 1,5</span></span><span class="vv">${money(r.valorHsExtraVac)}</span></div>
        <div class="liq-fila"><span class="cc">Cantidad hs extras vac.</span><span class="vv">${r.hsExtrasVacaciones||0}</span></div>
        <div class="liq-fila"><span class="cc"><strong>Total vacaciones</strong></span><span class="vv">${money(r.totalVacaciones)}</span></div>`;
    }
    return `<div class="liq">
      ${filas}
      <div class="liq-sep"></div>
      <div class="liq-fila"><span class="cc"><strong>Subtotal</strong></span><span class="vv">${money(r.subtotal)}</span></div>
      ${desc}
      ${vac}
      <div class="liq-fila tot"><span class="cc">${r.deVacaciones?'Liquidación total':'Total a pagar'}</span><span class="vv">${money(r.total)}</span></div>
    </div>`;
  }
  function liqFila(cc,nota,val,cls=''){
    return `<div class="liq-fila ${cls}"><span class="cc">${cc}${nota?`<span class="nota">${nota}</span>`:''}</span><span class="vv">${money(val)}</span></div>`;
  }
  function liqFilaPres(r,det){
    const badge = r.deVacaciones?'<span class="badge-ok">🌴 vacaciones · cobra</span>':(r.vinoCompleto?'<span class="badge-ok">✓ vino completo</span>':'<span class="badge-no">faltó · no cobra</span>');
    const nota = det?`<span class="nota">sobre bruto ${money(r.baseSueldoBruto)}</span>`:'';
    return `<div class="liq-fila"><span class="cc">Presentismo ${badge}${nota}</span><span class="vv">${money(r.presentismo)}</span></div>`;
  }
  function liqFilaPresPlus(r){
    const badge = r.vinoCompleto?'<span class="badge-ok">✓ vino completo</span>':'<span class="badge-no">faltó · no cobra</span>';
    return `<div class="liq-fila"><span class="cc">Presentismo del plus ${badge}</span><span class="vv">${money(r.plusPresentismo)}</span></div>`;
  }


  // Revierte los descuentos que esta quincena ya había aplicado a los saldos
  function revertirAplicacion(empId, clave){
    (db.prestamos[empId]||[]).forEach(x=>{
      if(x.aplicaciones && x.aplicaciones[clave]!==undefined){
        x.saldo += x.aplicaciones[clave];   // devolver el monto al saldo
        x.saldado = x.saldo>0 ? false : x.saldado;
        delete x.aplicaciones[clave];
      }
    });
  }
  // Aplica descuentoVale a los vales y descuentoPrestamo a los préstamos, bajando saldos
  function aplicarDescuentos(empId, clave, montoVale, montoPrestamo){
    const items=(db.prestamos[empId]||[]).filter(x=>!x.saldado);
    aplicarA(items.filter(x=>x.tipo==='vale'), montoVale, clave);
    aplicarA(items.filter(x=>x.tipo==='prestamo'), montoPrestamo, clave);
  }
  function aplicarA(lista, monto, clave){
    let resto=monto;
    for(const x of lista){
      if(resto<=0) break;
      const aplica=Math.min(resto, x.saldo);
      x.saldo -= aplica;
      x.aplicaciones = x.aplicaciones||{};
      x.aplicaciones[clave] = aplica;
      if(x.saldo<=0.001){ x.saldo=0; x.saldado=true; }
      resto -= aplica;
    }
  }

  function toast(msg){
    const t=document.createElement('div');
    t.textContent=msg;
    t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 20px;border-radius:8px;z-index:100;box-shadow:var(--sombra-alta);font-size:14px';
    document.body.appendChild(t); setTimeout(()=>t.remove(),2200);
  }

  // ---------- Pantalla: Resumen jefe ----------
  function vistaResumen(){
    const p=periodoActual();
    const claveMesRes = periodoActivo ? periodoActivo.split('-').slice(0,2).join('-') : null;
    function netoVacDe(claveEmp){
      if(!claveMesRes) return 0;
      const r=(db.sacBlanco[claveMesRes]||{})[claveEmp];
      return (r&&r.vac&&r.vac.neto>0)?(parseFloat(r.vac.neto)||0):0;
    }
    let tNegro=0,tDesc=0,tNeto=0,tDebe=0,tBlanco=0;
    const cajaItems=[];
    const filas=db.empleados.map(e=>{
      const d=p.datos[e.id];
      if(!d) return `<tr><td>${e.apellido}</td><td colspan="5" style="text-align:center;color:#8a7d63">sin cargar</td></tr>`;
      const r=calcularEmpleado(e,d);
      const desc=r.descuentoVale+r.descuentoPrestamo;
      const debe=(db.prestamos[e.id]||[]).filter(x=>!x.saldado).reduce((s,x)=>s+(x.saldo||0),0);
      const netoVac=netoVacDe(e.id);
      const blanco=(parseFloat(d.sueldoBlanco)||0)+netoVac;
      tNegro+=r.subtotal; tDesc+=desc; tNeto+=r.total; tDebe+=debe; tBlanco+=blanco;
      cajaItems.push({ nombre:e.apellido, monto:r.total });
      const infoVac=netoVac>0?`<div style="font-size:10.5px;color:var(--tinta-2)" class="no-print">incluye vac ${money0(netoVac)}</div>`:'';
      return `<tr><td>${e.apellido}</td>
        <td>${money0(r.subtotal)}</td>
        <td style="color:${desc?'var(--rojo)':'#8a7d63'}">${desc?money0(desc):'0'}</td>
        <td style="font-weight:600">${money0(r.total)}</td>
        <td style="color:${debe?'var(--ambar)':'#8a7d63'}">${debe?money0(debe):'0'}</td>
        <td>${blanco?money0(blanco):'<span style="color:#8a7d63">—</span>'}${infoVac}</td></tr>`;
    }).join('');
    const sinCargar=db.empleados.filter(e=>!p.datos[e.id]).map(e=>e.apellido);
    // datos incompletos: cargó algo pero falta bruto, neto o días
    const incompletos=db.empleados.filter(e=>{
      const d=p.datos[e.id]; if(!d) return false;
      const faltaBruto=!(parseFloat(d.sueldoBruto)>0);
      const faltaNeto=!(parseFloat(d.sueldoBlanco)>0);
      const faltaDias=(d.diasVino===undefined||d.diasVino==='');
      return faltaBruto||faltaNeto||faltaDias;
    }).map(e=>{
      const d=p.datos[e.id]; const faltan=[];
      if(!(parseFloat(d.sueldoBruto)>0)) faltan.push('bruto');
      if(!(parseFloat(d.sueldoBlanco)>0)) faltan.push('neto');
      if(d.diasVino===undefined||d.diasVino==='') faltan.push('días');
      return `${e.apellido} (falta ${faltan.join(', ')})`;
    });
    let avisoFalta='';
    if(sinCargar.length)
      avisoFalta += `<div class="aviso no-print">⚠ Falta cargar la liquidación de: <strong>${sinCargar.join(', ')}</strong>. El total todavía no está completo.</div>`;
    if(incompletos.length)
      avisoFalta += `<div class="aviso no-print" style="border-color:var(--ambar)">📝 Datos incompletos: <strong>${incompletos.join('; ')}</strong>. Revisá antes de imprimir.</div>`;
    // bloque administración: bruto (solo pantalla, alimenta SAC) + neto (se imprime)
    // Los montos se guardan POR MES en db.sacBlanco[claveMes]["admin:Nombre"], según el mes del período visible.
    const admin=db.admin||[];
    const claveMesAdmin = periodoActivo ? periodoActivo.split('-').slice(0,2).join('-') : null;
    function adminMonto(nombre,campo){
      if(!claveMesAdmin) return 0;
      const r=(db.sacBlanco[claveMesAdmin]||{})['admin:'+nombre];
      return r ? (parseFloat(r[campo])||0) : 0;
    }
    let tAdmin=0;
    const filasAdmin=admin.map((a,i)=>{
      const neto=adminMonto(a.nombre,'neto')+netoVacDe('admin:'+a.nombre); tAdmin+=neto;
      return `<tr><td>${a.nombre}${a.gerente?' <span style="font-size:10px;color:#8a7d63">(gerente)</span>':''}</td>
        <td>${money0(neto)}</td>
        <td class="no-print"><button onclick="App.borrarAdmin(${i})" style="background:none;border:none;color:var(--rojo);font-size:12px;cursor:pointer">Eliminar</button></td></tr>`;
    }).join('');
    const totalGeneralBlanco = tBlanco + tAdmin;
    const blancoQuincenales=db.empleados

        <span style="margin-left:auto;font-size:12px;color:var(--tinta-2);font-weight:400">tocá para ver el detalle</span>
      </summary>
      <div class="card-cuerpo" style="padding:0;border-top:1px solid var(--linea)">
        <table><thead><tr><th>Empleado</th><th style="text-align:right">Efectivo (Parte B)</th></tr></thead>
        <tbody>${filasCaja}
          <tr class="t-total"><td>Total a juntar</td><td style="text-align:right;font-size:16px">${money0(totalCaja)}</td></tr>

        <div style="padding:8px 14px;font-size:11.5px;color:var(--tinta-2)">Es el negro (Parte B) de los quincenales después de descuentos. No incluye administrativos ni sueldos en blanco.</div>

  // ---------- Pantalla: Comprobantes imprimibles ----------
  function vistaComprobantes(){
    const p=periodoActual();
    const cargados=db.empleados.filter(e=>p.datos[e.id]);
    if(cargados.length===0){
      return `<div class="card"><div class="card-cuerpo"><div class="vacio"><div class="ico">🧾</div>

    }
    const comprobantes=cargados.map(e=>comprobanteHTML(e,calcularEmpleado(e,p.datos[e.id]),p)).join('');

    const clavePref = periodoActivo+'|';
    const compDeuda=db.empleados.map(e=>{
      const conCuota=(db.prestamos[e.id]||[])
        .filter(x=>x.tipo==='prestamo' && x.aplicaciones && x.aplicaciones[clavePref+e.id]>0);
      if(conCuota.length===0) return '';
      // Uno solo por empleado. Si tuviera más de un préstamo con cuota, lo que
      // queda debiendo es la suma de los saldos.
      const saldoNuevo=conCuota.reduce((s,x)=>s+num(x.saldo),0);

      <div style="margin:22px 0 12px" class="no-print"><div style="font-size:16px;font-weight:600">Comprobantes de deuda de préstamo</div>

    <div class="no-print" style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
      <div><div style="font-size:16px;font-weight:600">Comprobantes</div>
        <div style="font-size:12.5px;color:var(--tinta-2)">${p.etiqueta} · ${cargados.length} empleado${cargados.length>1?'s':''}</div></div>
      <div class="campo" style="margin-left:auto;max-width:150px">
        <label>Por hoja (al imprimir)</label>
        <select id="porHoja" onchange="App.setPorHoja(this.value)">

          <option value="3" selected>3 por hoja</option>
          <option value="4">4 por hoja</option>
          <option value="1">1 por hoja</option>

      <button class="btn" onclick="window.print()">🖨 Imprimir todos</button>

    <div class="aviso no-print">Elegí cuántos comprobantes entran por hoja para ahorrar papel. Ninguno se corta entre páginas. También podés imprimir uno solo desde el botón de cada tarjeta.</div>
    <div id="comprobantes" class="ph3">${comprobantes}</div>

      <div style="margin-top:44px;font-size:14px"><span style="font-weight:700;margin-right:12px">FIRMA</span><span style="display:inline-block;border-bottom:1px solid var(--tinta);min-width:260px;height:1px;vertical-align:bottom"></span></div>
